# Verifies every supported Node release before users receive a package or report contract change.
# Contributors reach this workflow on pushes and pull requests to the maintained branches.
# Read-only repository permission is sufficient for checkout, tests, audit, and the self-scan.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    name: Test and analyse (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Type check and unit tests
        run: npm run check

      - name: gruff-ts analyse
        run: ./bin/gruff-ts analyse . --fail-on=advisory
